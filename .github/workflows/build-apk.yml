name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ScheduledMultiClicker.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScheduledMultiClicker-debug-apk
          path: ScheduledMultiClicker.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "定時多點連點器 v1.0.0 (直接下載 APK)"
          body: "點擊下方 Assets 中的 **ScheduledMultiClicker.apk** 即可直接下載安裝（免登入、免解壓縮）。"
          files: ScheduledMultiClicker.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
